
name: MOJa ALARM Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        id: extract
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "MOJaAlarm-fixed.zip" ]; then
            ZIP_FILE="MOJaAlarm-fixed.zip"
          elif [ -f "MOJaAlarm-mobile-upload-2.zip" ]; then
            ZIP_FILE="MOJaAlarm-mobile-upload-2.zip"
          else
            echo "ERROR: Project ZIP not found"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PACKAGE_FILE="$(find extracted -type f -name package.json -print -quit)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json not found"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Project directory: $PROJECT_DIR"
          test -d "$PROJECT_DIR/android"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install project dependencies
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm install --no-audit --no-fund

      - name: Run JavaScript tests
        working-directory: ${{ steps.extract.outputs.project_dir }}
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+test($|[[:space:]])'; then
            npm test
          else
            echo "No test script found; skipping tests."
          fi

      - name: Build web assets
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npm run build:web

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager -print -quit 2>/dev/null || true)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sync Capacitor
        working-directory: ${{ steps.extract.outputs.project_dir }}
        run: npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.extract.outputs.project_dir }}/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="${{ steps.extract.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK not found or empty"
            exit 1
          fi

          echo "APK successfully verified:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJa-ALARM-debug-apk
          path: ${{ steps.extract.outputs.project_dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

