
name: MOJa ALARM Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f MOJaAlarm-fixed.zip ]; then
            ZIP_FILE="MOJaAlarm-fixed.zip"
          elif [ -f MOJaAlarm-mobile-upload-2.zip ]; then
            ZIP_FILE="MOJaAlarm-mobile-upload-2.zip"
          else
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          PACKAGE_FILE="$(find extracted -type f -name package.json -print -quit)"
          test -n "$PACKAGE_FILE"

          echo "PROJECT_DIR=$(dirname "$PACKAGE_FILE")" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        working-directory: MOJaAlarm
        run: npm install --no-audit --no-fund

      - name: Run JavaScript tests
        working-directory: MOJaAlarm
        run: npm test

      - name: Build web assets
        working-directory: MOJaAlarm
        run: npm run build:web

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

       - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Sync Capacitor
        working-directory: MOJaAlarm
        run: npx cap sync android

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          set -euo pipefail
          gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MOJa-ALARM-debug-apk
          path: MOJaAlarm/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
